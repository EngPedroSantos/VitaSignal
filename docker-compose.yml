services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: vitasignal
      POSTGRES_USER: vitasignal
      POSTGRES_PASSWORD: vitasignal
    ports:
      - "5432:5432"
    volumes:
      - vitasignal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitasignal -d vitasignal"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: VitaSignal.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__VitaSignalDb: "Host=db;Port=5432;Database=vitasignal;Username=vitasignal;Password=vitasignal"
    depends_on:
      db:
        condition: service_healthy
    
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api
      
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/json
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    
volumes:
  vitasignal-db-data:
  grafana-data: