apiVersion: 1

groups:
  - orgId: 1
    name: vitasignal-platform
    folder: VitaSignal
    interval: 1m
    rules:
      - uid: vitasignal-api-down
        title: API scrape target down
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: Prometheus cannot reach the VitaSignal API.
          description: The API is down or the /metrics endpoint is not responding.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: up{job="vitasignal-api"}
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: vitasignal-high-error-rate
        title: High 5xx error rate
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: More than 5% of API requests are failing with 5xx.
          description: Check the API logs (filter by level Error) and the database health check at /health/ready.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: (sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5..",http_route!~"/metrics|/health/.*"}[5m])) or vector(0)) / sum(rate(http_server_request_duration_seconds_count{http_route!~"/metrics|/health/.*"}[5m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.05] }

      - uid: vitasignal-slow-ingestion
        title: Slow reading ingestion
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: p95 latency of POST api/VitalReadings is above 500 ms.
          description: Devices send a reading every few seconds; sustained slow writes build up a backlog on the client side.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{http_request_method="POST",http_route="api/VitalReadings"}[5m])))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.5] }

      - uid: vitasignal-ingestion-stopped
        title: Reading ingestion stopped
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: No vital sign reading was accepted in the last 5 minutes.
          description: Devices stopped sending data or every reading is being rejected. Check the rejected readings panel before anything else.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(increase(vitasignal_vital_readings_registered_total[5m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
